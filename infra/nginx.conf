# Use the client address supplied by the HTTPS proxy (Caddy replaces any client-sent value);
# when there is no proxy in front, fall back to the peer address.
map $http_x_forwarded_for $client_forwarded_for {
  default $http_x_forwarded_for;
  ""      $remote_addr;
}

# WebSocket upgrade for the live session (/api/v1/sessions/{id}/ws); plain requests keep "close".
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The API compares the WebSocket Origin with this host, port included.
    proxy_set_header Host $http_host;
    # A live session is one long-lived socket.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header X-Forwarded-For $client_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz { proxy_pass http://api:8000; }
  location = /readyz { proxy_pass http://api:8000; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
