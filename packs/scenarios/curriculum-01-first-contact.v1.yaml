summary:
  en: Clear morning over farmland and low hills around a fictional depot. One small rotary drone approaches
    from the north-east. Radar and a day camera cover that side. Detect it, classify it, assess it and
    answer inside the rules.
  hi: खेत और नीची पहाड़ियों के बीच एक काल्पनिक डिपो पर साफ़ सुबह। उत्तर-पूर्व से एक छोटा रोटरी ड्रोन आता
    है। रडार और दिन का कैमरा उसी ओर देखते हैं। उसे पहचानें, वर्गीकृत करें, आकलन करें और नियमों के भीतर
    जवाब दें।
