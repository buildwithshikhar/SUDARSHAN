title:
  en: 'Alder Quay: town traffic'
  hi: 'एल्डर क्वे: शहरी यातायात'
summary:
  en: A clear day over a fictional river town and its pumping station. A small rotary drone approaches
    from the north-west while a filed civil survey drone works the south-west and birds circle the east.
    Tell the hostile contact from the traffic.
  hi: एक काल्पनिक नदी-नगर और उसके पंपिंग स्टेशन पर साफ़ दिन। उत्तर-पश्चिम से एक छोटा रोटरी ड्रोन आता है,
    जबकि दर्ज नागरिक सर्वे ड्रोन दक्षिण-पश्चिम में काम करता है और पूर्व में पक्षी चक्कर लगाते हैं। शत्रु
    संपर्क को बाकी यातायात से अलग पहचानें।
