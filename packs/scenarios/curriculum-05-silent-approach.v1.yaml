summary:
  en: A dark night over a fictional wharf district. One small autonomous drone approaches from the south-south-west
    and emits nothing for the passive radio sensor to hear. Rely on radar, thermal and night vision, and
    do not wait for a radio cue.
  hi: एक काल्पनिक घाट इलाके पर अँधेरी रात। दक्षिण-दक्षिण-पश्चिम से एक छोटा स्वायत्त ड्रोन आता है जो निष्क्रिय
    रेडियो सेंसर को कुछ भी नहीं सुनाता। रडार, थर्मल और नाइट-विज़न पर भरोसा करें; रेडियो संकेत की प्रतीक्षा
    न करें।
