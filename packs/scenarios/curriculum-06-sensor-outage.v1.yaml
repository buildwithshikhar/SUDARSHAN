title:
  en: 'Kite Hill: sensor outage'
  hi: 'काइट हिल: सेंसर बाधा'
summary:
  en: Hazy morning over a fictional grain store. One small rotary drone comes in from the north-north-east.
    The radar drops out for part of the approach and haze thins the day camera's picture, so the passive
    radio sensor and your own judgement have to bridge the gap.
  hi: एक काल्पनिक अनाज गोदाम पर धुंधली सुबह। उत्तर-उत्तर-पूर्व से एक छोटा रोटरी ड्रोन आता है। आगमन के
    एक हिस्से में रडार बंद हो जाता है और धुंध दिन के कैमरे का चित्र फीका करती है, इसलिए निष्क्रिय रेडियो
    सेंसर और आपके अपने निर्णय को अंतर पाटना होगा।
