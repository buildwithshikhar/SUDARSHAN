summary:
  en: A clear day over a fictional mill quarter. One small rotary drone approaches from the north-west
    just as the radar loses a sector of its sweep, and a radio interferer raises the false-alarm rate
    on the passive sensor. The camera is the one instrument looking the right way.
  hi: एक काल्पनिक मिल मोहल्ले पर साफ़ दिन। उत्तर-पश्चिम से एक छोटा रोटरी ड्रोन ठीक तब आता है जब रडार अपने
    घेरे का एक खंड खो देता है, और रेडियो व्यवधान निष्क्रिय सेंसर की झूठी चेतावनियाँ बढ़ा देता है। सही
    दिशा में देखने वाला उपकरण केवल कैमरा है।
