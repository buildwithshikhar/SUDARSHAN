title:
  en: 'Plover Flats: small swarm'
  hi: 'प्लोवर फ्लैट्स: छोटा झुंड'
summary:
  en: A clear day over a fictional rail siding. Seven small rotary drones fly in as one leader-follower
    group from the north-east, in trail. Count them, report the group as one picture and answer every
    member inside the rules.
  hi: एक काल्पनिक रेल साइडिंग पर साफ़ दिन। सात छोटे रोटरी ड्रोन एक नेता-अनुयायी समूह के रूप में, एक के
    पीछे एक, उत्तर-पूर्व से आते हैं। उन्हें गिनें, समूह को एक चित्र के रूप में रिपोर्ट करें और नियमों
    के भीतर हर सदस्य का जवाब दें।
