id: curriculum-09-decoy-swarm
version: 1.0.0
title:
  en: 'Gull Street: decoy swarm'
  hi: 'गल स्ट्रीट: छलावा झुंड'
summary:
  en: A dark night over a fictional tram depot. Nine small drones come in from the north-west as one group;
    two of them are decoys that look like the rest on radar but run colder and quieter. Do not let the
    decoys pull your attention from the real contacts.
  hi: एक काल्पनिक ट्राम डिपो पर अँधेरी रात। नौ छोटे ड्रोन एक समूह के रूप में उत्तर-पश्चिम से आते हैं;
    उनमें से दो छलावे हैं जो रडार पर बाकियों जैसे दिखते हैं पर अधिक ठंडे और शांत चलते हैं। छलावों को असली
    संपर्कों से अपना ध्यान न हटाने दें।
