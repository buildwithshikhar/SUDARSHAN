id: curriculum-10-fast-mover
version: 1.0.0
title:
  en: 'Reed Bank: fast mover'
  hi: 'रीड बैंक: तेज़ संपर्क'
summary:
  en: 'First light over a fictional pumping works. A fast first-person-view class drone comes in low from
    the east at roughly twice the speed of the earlier drones, while a flock of birds works the north-west
    fields. There is little time: decide quickly and do not mistake the flock for a threat.'
  hi: 'एक काल्पनिक पंपिंग वर्क्स पर भोर की पहली रोशनी। पहले के ड्रोनों से लगभग दुगुनी गति से एक तेज़ एफ़पीवी
    श्रेणी का ड्रोन पूर्व से नीची उड़ान में आता है, जबकि उत्तर-पश्चिम के खेतों में पक्षियों का झुंड घूमता
    है। समय कम है: जल्दी निर्णय लें और झुंड को ख़तरा न समझें।'
