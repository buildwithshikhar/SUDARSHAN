id: curriculum-11-fixed-wing-clutter
version: 1.0.0
title:
  en: 'Cobbler''s Row: fixed wing and clutter'
  hi: 'कॉब्लर्स रो: स्थिर-पंख और अव्यवस्था'
summary:
  en: A clear day over a fictional market quarter. A medium fixed-wing drone arrives from the east and
    circles the district at around 100 m while a tethered kite and a drifting balloon sit in the same
    sky. Fixed-wing drones look and sound different from quadcopters; the clutter must not be engaged.
  hi: एक काल्पनिक बाज़ार मोहल्ले पर साफ़ दिन। एक मध्यम स्थिर-पंख ड्रोन पूर्व से आता है और लगभग 100 मीटर
    की ऊँचाई पर इलाके का चक्कर लगाता है, जबकि एक डोर से बँधी पतंग और बहता गुब्बारा उसी आकाश में हैं। स्थिर-पंख
    ड्रोन क्वाडकॉप्टर से अलग दिखते और सुनाई देते हैं; अव्यवस्था वाले संपर्कों पर कार्रवाई नहीं करनी है।
