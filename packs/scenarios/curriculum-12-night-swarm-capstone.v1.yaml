contract: scenario.v1
id: curriculum-12-night-swarm-capstone
version: 1.0.0
title:
  en: 'Marlin Fields: night swarm'
  hi: 'मार्लिन फील्ड्स: रात्रि झुंड'
summary:
  en: A moonless night over a fictional seed farm. Seven small drones, one of them a decoy and one radio-silent,
    approach as one group from the north-east while the thermal imager drops out and a filed civil survey
    drone works the south-west. Everything from the earlier scenarios at once.
  hi: एक काल्पनिक बीज फ़ार्म पर चाँदरहित रात। सात छोटे ड्रोन, जिनमें एक छलावा है और एक रेडियो-मौन है,
    एक समूह के रूप में उत्तर-पूर्व से आते हैं; इसी बीच थर्मल इमेजर बंद हो जाता है और दर्ज नागरिक सर्वे
    ड्रोन दक्षिण-पश्चिम में काम करता है। पिछले सभी परिदृश्य एक साथ।
fictional: true
