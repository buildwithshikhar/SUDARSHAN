# Generic acoustic microphone array for the acoustic model (services/api/sim/sensors/acoustic.py).
# Fictional figures, calibrated from the cited open datasets in structure only: DroneAudioDataset
# (D10) for the rotor signature, DREGON (D11) for blade-pass versus motor speed, and the Svanstrom
# multi-sensor set (D12) for drone, bird and fixed-wing confusers. Nothing is marked verified; the
# bird wing-beat band against the drone fundamental is UNVERIFIED (Q-09).
contract: sensor-profile.v1
id: acoustic-generic-array
version: 1.0.0
title:
  en: Generic acoustic microphone array
  hi: सामान्य ध्वनिक माइक्रोफ़ोन ऐरे
modality: acoustic
fictional: true
parameters:
  # Coverage and update. The hard range limit follows the 50 to 300 m of the secondary literature.
  instrumented_range: { value: 300, unit: m, source_id: F01, verified: false }
  update_interval: { value: 0.5, unit: s, source_id: F01, verified: false }
  # Noise (decibels in the processed band)
  background_noise: { value: 38, unit: dB, source_id: F01, verified: false }
  wind_noise_base: { value: 20, unit: dB, source_id: F01, verified: false }
  wind_noise_slope: { value: 2.5, unit: dB/mps, source_id: F01, verified: false }
  rain_noise: { value: 44, unit: dB, source_id: F01, verified: false }
  absorption: { value: 5, unit: dB/km, source_id: F01, verified: false }
