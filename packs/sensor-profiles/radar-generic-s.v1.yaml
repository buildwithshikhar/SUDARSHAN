# Generic short-range surveillance radar for the detection model in services/api/sim/sensors/radar.py.
# Honesty: this is a fictional radar. System figures (power budget, clutter, noise, false alarms) are
# project-authored (F01). The cross-section values sit inside the published small-multirotor and
# bird ranges quoted in docs/02-research.md section 2 (Ezuma et al. 2019, Seidaliyeva 2023), which
# have no row in docs/DATA_REGISTER.md yet (Q-20), so they are F01 and verified: false.
contract: sensor-profile.v1
id: radar-generic-s
version: 0.2.0
title:
  en: Generic short-range surveillance radar
  hi: सामान्य कम दूरी निगरानी रडार
modality: radar
fictional: true
parameters:
  # Coverage and update
  instrumented_range: { value: 4600, unit: m, source_id: F01, verified: false }
  update_interval: { value: 1.2, unit: s, source_id: F01, verified: false }
  min_elevation: { value: -2, unit: deg, source_id: F01, verified: false }
  max_elevation: { value: 38, unit: deg, source_id: F01, verified: false }
  # Radar equation: SNR (dB) at snr_ref_range for a 0 dBsm target, then R^-4; Pd is a logistic in
  # the margin over detection_threshold.
  snr_ref: { value: 45, unit: dB, source_id: F01, verified: false }
  snr_ref_range: { value: 1000, unit: m, source_id: F01, verified: false }
  detection_threshold: { value: 13, unit: dB, source_id: F01, verified: false }
  pd_slope: { value: 2.5, unit: dB, source_id: F01, verified: false }
  # Radar cross-section by class (literature range: small multirotor -20 to -8 dBsm, birds -30 to -19 dBsm).
  rcs_rotary_small: { value: -16, unit: dBsm, source_id: F01, verified: false }
  rcs_fixed_wing_small: { value: -10, unit: dBsm, source_id: F01, verified: false }
  rcs_bird: { value: -22, unit: dBsm, source_id: F01, verified: false }
  rcs_default: { value: -16, unit: dBsm, source_id: F01, verified: false }
  rcs_balloon: { value: -26, unit: dBsm, source_id: F01, verified: false }
  rcs_decoy_small: { value: -20, unit: dBsm, source_id: F01, verified: false }
  rcs_fixed_wing_large: { value: 3, unit: dBsm, source_id: F01, verified: false }
  rcs_fixed_wing_medium: { value: -3, unit: dBsm, source_id: F01, verified: false }
  rcs_fpv_small: { value: -18, unit: dBsm, source_id: F01, verified: false }
  rcs_kite: { value: -30, unit: dBsm, source_id: F01, verified: false }
  # Aspect: effective RCS swings by +/- this many dB between nose/tail and broadside.
  aspect_swing_rotary_small: { value: 4, unit: dB, source_id: F01, verified: false }
  aspect_swing_fixed_wing_small: { value: 4, unit: dB, source_id: F01, verified: false }
  aspect_swing_bird: { value: 3, unit: dB, source_id: F01, verified: false }
  aspect_swing_default: { value: 4, unit: dB, source_id: F01, verified: false }
  aspect_swing_balloon: { value: 0, unit: dB, source_id: F01, verified: false }
  aspect_swing_decoy_small: { value: 3, unit: dB, source_id: F01, verified: false }
  aspect_swing_fixed_wing_large: { value: 6, unit: dB, source_id: F01, verified: false }
  aspect_swing_fixed_wing_medium: { value: 5, unit: dB, source_id: F01, verified: false }
  aspect_swing_kite: { value: 2, unit: dB, source_id: F01, verified: false }
  # Low-slow-small: ground clutter near the horizon and a Doppler notch at zero radial speed.
  clutter_elevation: { value: 3, unit: deg, source_id: F01, verified: false }
  clutter_floor_loss: { value: 3, unit: dB, source_id: F01, verified: false }
  notch_speed: { value: 2.5, unit: m/s, source_id: F01, verified: false }
  notch_depth: { value: 12, unit: dB, source_id: F01, verified: false }
  # Modelled weather: one-way loss per km by condition, scaled by reference visibility / visibility.
  weather_ref_visibility: { value: 5000, unit: m, source_id: F01, verified: false }
  loss_clear: { value: 0, unit: dB/km, source_id: F01, verified: false }
  loss_haze: { value: 0.01, unit: dB/km, source_id: F01, verified: false }
  loss_fog: { value: 0.02, unit: dB/km, source_id: F01, verified: false }
  loss_dust: { value: 0.04, unit: dB/km, source_id: F01, verified: false }
  loss_rain: { value: 0.25, unit: dB/km, source_id: F01, verified: false }
  # Measurement noise at noise_ref_snr; it grows as the square root of the SNR shortfall.
  sigma_range: { value: 7.5, unit: m, source_id: F01, verified: false }
  sigma_azimuth: { value: 0.6, unit: deg, source_id: F01, verified: false }
  sigma_elevation: { value: 1.0, unit: deg, source_id: F01, verified: false }
  sigma_radial: { value: 0.4, unit: m/s, source_id: F01, verified: false }
  noise_ref_snr: { value: 20, unit: dB, source_id: F01, verified: false }
  # Micro-Doppler: resolved when SNR clears the detection threshold by md_resolve_margin.
  md_resolve_margin: { value: 6, unit: dB, source_id: F01, verified: false }
  md_resolve_slope: { value: 2, unit: dB, source_id: F01, verified: false }
  md_hz_rotor: { value: 120, unit: Hz, source_id: F01, verified: false }
  # UNVERIFIED (Q-09): the bird wing-beat band of 5-20 Hz is from a secondary source only.
  md_hz_wing_beat: { value: 12, unit: Hz, source_id: F01, verified: false }
  md_hz_spread: { value: 0.1, unit: ratio, source_id: F01, verified: false }
  # Clutter plots: expected per update, over a fixed number of slots.
  false_alarm_rate: { value: 0.2, unit: count, source_id: F01, verified: false }
  false_alarm_slots: { value: 4, unit: count, source_id: F01, verified: false }
  false_alarm_speed: { value: 6, unit: m/s, source_id: F01, verified: false }
  # Clutter degradation at severity 1.
  clutter_pd_loss: { value: 0.4, unit: ratio, source_id: F01, verified: false }
  clutter_noise_gain: { value: 0.5, unit: ratio, source_id: F01, verified: false }
  clutter_false_alarm_gain: { value: 9, unit: ratio, source_id: F01, verified: false }
confusion:
