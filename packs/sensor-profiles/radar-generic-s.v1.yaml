notes:
  en: Fictional radar built from open research figures and published specifications; parameters are calibrated from, not trained on, them. Cross-sections sit inside published ranges that have no data-register row yet (Q-20); see docs/SENSOR_MODELS.md. Weather is modelled.
  hi: काल्पनिक रडार, खुले शोध आँकड़ों और प्रकाशित विनिर्देशों से बना; पैरामीटर उनसे अंशांकित हैं, उन पर प्रशिक्षित नहीं। क्रॉस-सेक्शन प्रकाशित सीमाओं के भीतर हैं जिनकी डेटा रजिस्टर में अभी कोई पंक्ति नहीं है (Q-20); देखें docs/SENSOR_MODELS.md। मौसम मॉडलित है।
