  emitter_power_kite: { value: 0, unit: dBm, source_id: F01, verified: false }
  band_rotary_small: { value: 1, unit: index, source_id: D08, verified: false }
  band_fixed_wing_small: { value: 3, unit: index, source_id: F01, verified: false }
  band_bird: { value: 1, unit: index, source_id: F01, verified: false }
  band_autonomous_small: { value: 1, unit: index, source_id: F01, verified: false }
