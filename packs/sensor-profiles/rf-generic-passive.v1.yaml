confusion:
  # Rows: the true emitter. The rows of the silent classes (bird, autonomous-small, decoy-small,
  # kite, balloon) are never sampled (none emits) but scenarios may contain those classes. The
  # wifi-bluetooth row labels the false alarms. Columns after unknown were appended in wave 8.
  default:
    labels: [rotary-small, fixed-wing-small, wifi-bluetooth, unknown, fpv-small, fixed-wing-medium, fixed-wing-large]
    rows:
      rotary-small: [0.80, 0.03, 0.09, 0.08, 0.00, 0.00, 0.00]
      fixed-wing-small: [0.06, 0.72, 0.10, 0.12, 0.00, 0.00, 0.00]
      bird: [0.00, 0.00, 0.00, 1.00, 0.00, 0.00, 0.00]
      autonomous-small: [0.00, 0.00, 0.00, 1.00, 0.00, 0.00, 0.00]
      balloon: [0.00, 0.00, 0.00, 1.00, 0.00, 0.00, 0.00]
      civil-drone: [0.74, 0.03, 0.14, 0.09, 0.00, 0.00, 0.00]
      decoy-small: [0.00, 0.00, 0.00, 1.00, 0.00, 0.00, 0.00]
      fixed-wing-large: [0.00, 0.10, 0.06, 0.12, 0.00, 0.28, 0.44]
      fixed-wing-medium: [0.02, 0.40, 0.08, 0.12, 0.00, 0.34, 0.04]
      fpv-small: [0.52, 0.02, 0.10, 0.10, 0.26, 0.00, 0.00]
      kite: [0.00, 0.00, 0.00, 1.00, 0.00, 0.00, 0.00]
      wifi-bluetooth: [0.10, 0.04, 0.72, 0.14, 0.00, 0.00, 0.00]
