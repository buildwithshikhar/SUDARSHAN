# Generic passive RF detector for the RF model (services/api/sim/sensors/rf.py).
# Fictional figures, calibrated from the cited open datasets in structure only: DroneRF (D08) for
# the 2.4 GHz drone link, CardRF (D09) for the Wi-Fi and Bluetooth confusers. No value here is a
# measurement of a real receiver or a real drone; nothing is marked verified.
# Band index: 1 = 2.4 GHz, 2 = 5.8 GHz, 3 = 900 MHz, 4 = 433 MHz, 5 = 1.2-1.3 GHz (secondary plan).
contract: sensor-profile.v1
id: rf-generic-passive
version: 1.1.0
title:
  en: Generic passive RF detector
  hi: सामान्य निष्क्रिय आरएफ संसूचक
modality: rf
fictional: true
parameters:
  # Coverage and update
  instrumented_range: { value: 3000, unit: m, source_id: F01, verified: false }
  update_interval: { value: 1.0, unit: s, source_id: F01, verified: false }
  # Link budget
  rx_gain: { value: 3, unit: dB, source_id: F01, verified: false }
  noise_floor: { value: -95, unit: dBm, source_id: F01, verified: false }
  required_snr: { value: 10, unit: dB, source_id: F01, verified: false }
  transition_width: { value: 3, unit: dB, source_id: F01, verified: false }
  rain_attenuation: { value: 0.03, unit: dB/km, source_id: F01, verified: false }
  # Measurement noise: a passive wide-beam receiver gives coarse bearing and no range
  sigma_azimuth: { value: 9, unit: deg, source_id: F01, verified: false }
  sigma_elevation: { value: 18, unit: deg, source_id: F01, verified: false }
  sigma_rssi: { value: 2.5, unit: dB, source_id: F01, verified: false }
  sigma_hop_rate: { value: 0.08, unit: ratio, source_id: F01, verified: false }
  # Interference degradation
  interference_noise_rise: { value: 15, unit: dB, source_id: F01, verified: false }
  interference_false_alarm_gain: { value: 12, unit: ratio, source_id: F01, verified: false }
  # Wi-Fi and Bluetooth confusers
  false_alarm_slots: { value: 2, unit: count, source_id: D09, verified: false }
  false_alarm_probability: { value: 0.015, unit: ratio, source_id: D09, verified: false }
  confuser_hop_rate: { value: 800, unit: Hz, source_id: D09, verified: false }
  confuser_margin_span: { value: 14, unit: dB, source_id: D09, verified: false }
  confuser_elevation_max: { value: 25, unit: deg, source_id: F01, verified: false }
  # Per-class emitters. emits = 0 is an RF-silent class (autonomous, pre-programmed, fibre-optic).
