  emits_default: { value: 1, unit: flag, source_id: F01, verified: false }
  emits_balloon: { value: 0, unit: flag, source_id: F01, verified: false }
  emits_decoy_small: { value: 0, unit: flag, source_id: F01, verified: false }
  emits_kite: { value: 0, unit: flag, source_id: F01, verified: false }
  emitter_power_rotary_small: { value: 20, unit: dBm, source_id: F01, verified: false }
  emitter_power_fixed_wing_small: { value: 20, unit: dBm, source_id: F01, verified: false }
  emitter_power_bird: { value: 0, unit: dBm, source_id: F01, verified: false }
  emitter_power_autonomous_small: { value: 0, unit: dBm, source_id: F01, verified: false }
  emitter_power_default: { value: 20, unit: dBm, source_id: F01, verified: false }
  emitter_power_balloon: { value: 0, unit: dBm, source_id: F01, verified: false }
