    verified: false
notes:
  en: Calibrated from open RF datasets (D08, D09) in structure only; values are fictional, not trained on and not operational. Band plan and ranges come from secondary sources.
  hi: संरचना के लिए खुले आरएफ डेटासेट (D08, D09) से कैलिब्रेट; मान काल्पनिक हैं, प्रशिक्षण पर आधारित या संचालनात्मक नहीं। बैंड योजना और दूरियाँ द्वितीयक स्रोतों से हैं।
