# Threat class `fpv-small` for the threat catalogue (docs/THREAT_CATALOGUE.md).
# Honesty: a fictional class. Kinematics and signatures only. Every value is project-authored
# (F01, verified: false) unless a register ID below names the figure the sensor profiles already
# cited for it. The UAV Database (X01, CC0) has not been downloaded; extracting envelopes from it
# is pending (Q-11).
contract: threat-class.v1
id: fpv-small
version: 1.0.0
title:
  en: "Small first-person-view drone"
  hi: "छोटा एफ़पीवी ड्रोन"
summary:
  en: "A fast, agile quadcopter flown through a live video link. Faster and louder than a camera quadcopter, with a higher-pitched rotor tone and a hopping 5.8 GHz video and control link."
  hi: "लाइव वीडियो लिंक से उड़ाया जाने वाला तेज़ और फुर्तीला क्वाडकॉप्टर। कैमरा क्वाडकॉप्टर से तेज़ और अधिक शोर वाला, ऊँचे रोटर स्वर और हॉप करने वाले 5.8 GHz वीडियो व कंट्रोल लिंक के साथ।"
fictional: true
category: drone
recognition_class: fpv-small
default_disposition: hostile
uas_group: '1'
