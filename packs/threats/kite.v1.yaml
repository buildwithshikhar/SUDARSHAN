# Threat class `kite` for the threat catalogue (docs/THREAT_CATALOGUE.md).
# Honesty: a fictional class. Kinematics and signatures only. Every value is project-authored
# (F01, verified: false) unless a register ID below names the figure the sensor profiles already
# cited for it. The UAV Database (X01, CC0) has not been downloaded; extracting envelopes from it
# is pending (Q-11).
contract: threat-class.v1
id: kite
version: 1.0.0
title:
  en: "Kite"
  hi: "पतंग"
summary:
  en: "A tethered kite: slow, very low radar return, no radio and no sound source, bright and distinctive to a daylight camera."
  hi: "बँधी हुई पतंग: धीमी, बहुत कम रडार वापसी, कोई रेडियो नहीं और कोई ध्वनि स्रोत नहीं, दिन के कैमरे को चमकीली और विशिष्ट दिखती है।"
fictional: true
category: clutter
recognition_class: kite
default_disposition: clutter
uas_group: null
# The widest limits a scenario threat of this class may use (scenario.KinematicLimits).
envelope:
  max_speed: { value: 12, unit: m/s, source_id: F01, verified: false }
  cruise_speed: { value: 3, unit: m/s, source_id: F01, verified: false }
  max_accel: { value: 2, unit: m/s2, source_id: F01, verified: false }
  max_climb: { value: 3, unit: m/s, source_id: F01, verified: false }
  max_descent: { value: 3, unit: m/s, source_id: F01, verified: false }
  max_turn_rate: { value: 60, unit: deg/s, source_id: F01, verified: false }
  min_altitude: { value: 10, unit: m, source_id: F01, verified: false }
  max_altitude: { value: 150, unit: m, source_id: F01, verified: false }
# Names are the sensor-profile parameters without the _<class> suffix.
signature:
  rcs: { value: -30, unit: dBsm, source_id: F01, verified: false }
  aspect_swing: { value: 2, unit: dB, source_id: F01, verified: false }
  size: { value: 1, unit: m, source_id: F01, verified: false }
  contrast: { value: 0.15, unit: ratio, source_id: F01, verified: false }
  contrast_eo: { value: 1.3, unit: ratio, source_id: F01, verified: false }
  emits: { value: 0, unit: flag, source_id: F01, verified: false }
  emitter_power: { value: 0, unit: dBm, source_id: F01, verified: false }
  band: { value: 1, unit: index, source_id: F01, verified: false }
  hop_rate: { value: 0, unit: Hz, source_id: F01, verified: false }
  source_level: { value: -10, unit: dB, source_id: F01, verified: false }
  blades: { value: 0, unit: count, source_id: F01, verified: false }
  rpm: { value: 0, unit: rpm, source_id: F01, verified: false }
  harmonics: { value: 1, unit: count, source_id: F01, verified: false }
notes:
  en: "A source level of -10 dB means no acoustic source in the model: the array's noise floor hides it at any range inside its instrumented range."
  hi: "-10 dB का स्रोत स्तर मॉडल में कोई ध्वनि स्रोत न होने का अर्थ रखता है: ऐरे का शोर-तल इसे अपनी सीमा के भीतर हर दूरी पर छिपा लेता है।"
