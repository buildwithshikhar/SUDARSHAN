[project]
name = "terrain-bake"
version = "1.0.0"
description = "Offline bake of terrain packs from an SRTM tile and an OpenStreetMap extract"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "osmium>=3.7", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["osmium", "osmium.*"]
ignore_missing_imports = true
